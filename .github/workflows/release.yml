name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Production Tests
        run: node tests/test_production.js

      - name: Build Distribution
        run: node scripts/build.js

      - name: Package Dist Artifact
        run: |
          tar -czvf figma-antigravity-mcp-${{ github.ref_name }}.tar.gz dist/ package.json README.md
          zip -r figma-antigravity-mcp-${{ github.ref_name }}.zip dist/ package.json README.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            figma-antigravity-mcp-${{ github.ref_name }}.tar.gz
            figma-antigravity-mcp-${{ github.ref_name }}.zip
          generate_release_notes: true
          draft: false
          prerelease: false
